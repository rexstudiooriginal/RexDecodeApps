name: Decode All APKs in Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  decode-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install APKTool & JADX
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool
        
        # Download JADX dari GitHub (pakai versi 1.4.7 yang pasti ada)
        JADX_VERSION="1.4.7"
        wget -O jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-bin.zip"
        if [ $? -ne 0 ]; then
          echo "⚠️  Version $JADX_VERSION not found, trying 1.4.6..."
          JADX_VERSION="1.4.6"
          wget -O jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-bin.zip"
        fi
        if [ $? -ne 0 ]; then
          echo "⚠️  Version $JADX_VERSION not found, trying 1.4.5..."
          JADX_VERSION="1.4.5"
          wget -O jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-bin.zip"
        fi
        if [ $? -ne 0 ]; then
          echo "❌ All JADX versions failed. Installing from APT fallback..."
          sudo apt-get install -y jadx || echo "⚠️  jadx not available in APT either"
        fi
        
        # Ekstrak dan install jika file zip ada
        if [ -f jadx.zip ]; then
          unzip -o jadx.zip -d jadx
          sudo mv jadx/bin/jadx /usr/local/bin/
          chmod +x /usr/local/bin/jadx
          echo "✅ JADX installed successfully"
        fi
        
        echo "✅ apktool version: $(apktool --version 2>/dev/null || echo 'unknown')"
        echo "✅ jadx version: $(jadx --version 2>/dev/null || echo 'not installed')"

    - name: Decode all APK files in root
      run: |
        mkdir -p output/
        APK_FILES=(*.apk)
        if [ ${#APK_FILES[@]} -eq 0 ] || [ ! -f "${APK_FILES[0]}" ]; then
          echo "❌ No .apk files found in root!"
          exit 1
        fi
        
        for apk in *.apk; do
          echo "========================================="
          echo "📦 Processing: $apk"
          echo "========================================="
          
          BASE_NAME="${apk%.apk}"
          mkdir -p "output/$BASE_NAME"
          
          echo "🔧 Running apktool on $apk..."
          apktool d "$apk" -o "output/$BASE_NAME/apktool" 2>/dev/null || echo "⚠️  apktool warning (ignored)"
          
          echo "☕ Running jadx on $apk..."
          if command -v jadx &> /dev/null; then
            jadx "$apk" -d "output/$BASE_NAME/jadx" 2>/dev/null || echo "⚠️  jadx warning (ignored)"
          else
            echo "⚠️  jadx not available, skipping Java decompile"
            echo "Java decompilation skipped" > "output/$BASE_NAME/jadx_status.txt"
          fi
          
          cp "$apk" "output/$BASE_NAME/"
          echo "✅ Done: $apk"
          echo ""
        done

    - name: Generate summary report
      run: |
        echo "## 📊 APK Decode Report" > summary.md
        echo "" >> summary.md
        echo "| APK File | apktool | jadx | Size |" >> summary.md
        echo "|----------|---------|------|------|" >> summary.md
        
        for apk in *.apk; do
          BASE_NAME="${apk%.apk}"
          SIZE=$(du -h "$apk" | cut -f1)
          APKTOOL_OK="✅"
          JADX_OK="✅"
          [ ! -d "output/$BASE_NAME/apktool" ] && APKTOOL_OK="❌"
          [ ! -d "output/$BASE_NAME/jadx" ] && JADX_OK="⚠️ (jadx missing)"
          echo "| \`$apk\` | $APKTOOL_OK | $JADX_OK | $SIZE |" >> summary.md
        done
        
        echo "" >> summary.md
        echo "📁 **Total APK decoded: $(ls -1 *.apk 2>/dev/null | wc -l)**" >> summary.md

    - name: Upload all results
      uses: actions/upload-artifact@v4
      with:
        name: all-decompiled-apks
        path: output/

    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: summary.md