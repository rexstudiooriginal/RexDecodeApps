name: Decode All APKs in Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  decode-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install APKTool & JADX (APT)
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool jadx
        echo "✅ apktool version: $(apktool --version)"
        echo "✅ jadx version: $(jadx --version 2>/dev/null || echo 'installed')"

    - name: Decode all APK files in root
      run: |
        mkdir -p output/
        APK_FILES=(*.apk)
        if [ ${#APK_FILES[@]} -eq 0 ] || [ ! -f "${APK_FILES[0]}" ]; then
          echo "❌ No .apk files found in root!"
          exit 1
        fi
        
        for apk in *.apk; do
          echo "========================================="
          echo "📦 Processing: $apk"
          echo "========================================="
          
          BASE_NAME="${apk%.apk}"
          mkdir -p "output/$BASE_NAME"
          
          echo "🔧 Running apktool on $apk..."
          apktool d "$apk" -o "output/$BASE_NAME/apktool" 2>/dev/null || echo "⚠️  apktool warning"
          
          echo "☕ Running jadx on $apk..."
          jadx "$apk" -d "output/$BASE_NAME/jadx" 2>/dev/null || echo "⚠️  jadx warning"
          
          cp "$apk" "output/$BASE_NAME/"
          echo "✅ Done: $apk"
          echo ""
        done

    - name: Generate summary report
      run: |
        echo "## 📊 APK Decode Report" > summary.md
        echo "" >> summary.md
        echo "| APK File | apktool | jadx | Size |" >> summary.md
        echo "|----------|---------|------|------|" >> summary.md
        
        for apk in *.apk; do
          BASE_NAME="${apk%.apk}"
          SIZE=$(du -h "$apk" | cut -f1)
          APKTOOL_OK="✅"
          JADX_OK="✅"
          [ ! -d "output/$BASE_NAME/apktool" ] && APKTOOL_OK="❌"
          [ ! -d "output/$BASE_NAME/jadx" ] && JADX_OK="❌"
          echo "| \`$apk\` | $APKTOOL_OK | $JADX_OK | $SIZE |" >> summary.md
        done
        
        echo "" >> summary.md
        echo "📁 **Total APK decoded: $(ls -1 *.apk 2>/dev/null | wc -l)**" >> summary.md

    - name: Upload all results
      uses: actions/upload-artifact@v4
      with:
        name: all-decompiled-apks
        path: output/

    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: summary.md