name: Decode All APKs in Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Manual trigger

jobs:
  decode-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install APKTool & JADX
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool
        wget -O jadx.zip https://github.com/skylot/jadx/releases/latest/download/jadx-bin.zip
        unzip jadx.zip -d jadx
        sudo mv jadx/bin/jadx /usr/local/bin/
        chmod +x /usr/local/bin/jadx

    - name: Decode all APK files in root
      run: |
        mkdir -p output/
        APK_FILES=(*.apk)
        if [ ${#APK_FILES[@]} -eq 0 ] || [ ! -f "${APK_FILES[0]}" ]; then
          echo "❌ Tidak ada file .apk di root repository!"
          exit 1
        fi
        
        for apk in *.apk; do
          echo "========================================="
          echo "📦 Processing: $apk"
          echo "========================================="
          
          # Buat folder per APK
          BASE_NAME="${apk%.apk}"
          mkdir -p "output/$BASE_NAME"
          
          # Apktool (resource + smali)
          echo "🔧 Running apktool on $apk..."
          apktool d "$apk" -o "output/$BASE_NAME/apktool" 2>/dev/null || echo "⚠️  apktool warning (ignored)"
          
          # Jadx (Java decompile)
          echo "☕ Running jadx on $apk..."
          jadx "$apk" -d "output/$BASE_NAME/jadx" 2>/dev/null || echo "⚠️  jadx warning (ignored)"
          
          # Copy original APK ke output (referensi)
          cp "$apk" "output/$BASE_NAME/"
          
          echo "✅ Done: $apk"
          echo ""
        done

    - name: Generate summary report
      run: |
        echo "## 📊 APK Decode Report" > summary.md
        echo "" >> summary.md
        echo "| APK File | apktool | jadx | Size |" >> summary.md
        echo "|----------|---------|------|------|" >> summary.md
        
        for apk in *.apk; do
          BASE_NAME="${apk%.apk}"
          SIZE=$(du -h "$apk" | cut -f1)
          APKTOOL_OK="✅"
          JADX_OK="✅"
          [ ! -d "output/$BASE_NAME/apktool" ] && APKTOOL_OK="❌"
          [ ! -d "output/$BASE_NAME/jadx" ] && JADX_OK="❌"
          echo "| \`$apk\` | $APKTOOL_OK | $JADX_OK | $SIZE |" >> summary.md
        done
        
        echo "" >> summary.md
        echo "📁 **Total APK decoded: $(ls -1 *.apk 2>/dev/null | wc -l)**" >> summary.md
        echo "" >> summary.md
        echo "📥 Download artifacts to get full decompiled source." >> summary.md

    - name: Upload all results
      uses: actions/upload-artifact@v4
      with:
        name: all-decompiled-apks
        path: output/

    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: report
        path: summary.md